services:
  - type: web
    name: ai-playground-agent-api
    runtime: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ACCESS_CODE
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_MODEL_COMPLEX
        value: gpt-6.1-sol
