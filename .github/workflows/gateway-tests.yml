name: Test Home Permission Gateway

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-tests.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run permission tests
        working-directory: gateway
        run: npm test
